<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameZone Vault | Exclusive Game Downloads & Premium Mods</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            max-width: 500px;
            width: 100%;
            padding: 30px 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .badge {
            display: inline-block;
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(96, 165, 250, 0.3);
            font-size: 0.85rem;
            font-weight: 600;
            padding: 6px 16px;
            border-radius: 50px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .game-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 10px;
        }

        .game-subtitle {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 25px;
            background: #0f172a;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid #1e293b;
        }

        .info-item {
            text-align: left;
        }

        .info-label {
            font-size: 0.75rem;
            color: #64748b;
            text-transform: uppercase;
            font-weight: 600;
        }

        .info-value {
            font-size: 0.95rem;
            color: #e2e8f0;
            font-weight: 600;
            margin-top: 2px;
        }

        .download-btn {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 700;
            padding: 16px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
            text-decoration: none;
        }

        .download-btn:hover {
            background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
            transform: translateY(-2px);
        }

        .features {
            margin-top: 25px;
            border-top: 1px solid #334155;
            padding-top: 20px;
            display: flex;
            justify-content: space-around;
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .check-icon {
            color: #22c55e;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="badge">Verified Download Portal</div>
        <h1 class="game-title">GameZone Vault</h1>
        <p class="game-subtitle">Get instant access to top-trending games, unlocked APKs, and exclusive mod menus.</p>

        <div class="info-grid">
            <div class="info-item">
                <div class="info-label">File Status</div>
                <div class="info-value" style="color: #22c55e;">● Safe & Clean</div>
            </div>
            <div class="info-item">
                <div class="info-label">Last Update</div>
                <div class="info-value">Today</div>
            </div>
            <div class="info-item">
                <div class="info-label">Platform</div>
                <div class="info-value">Android / iOS / PC</div>
            </div>
            <div class="info-item">
                <div class="info-label">Downloads</div>
                <div class="info-value">142,850+</div>
            </div>
        </div>

        <!-- أضف رابط الـ Content Locker الخص بك من OGAds مكان # -->
        <a href="#" class="download-btn">
            📥 Download Now (Free)
        </a>

        <div class="features">
            <div class="feature-item"><span class="check-icon">✓</span> Fast Speed</div>
            <div class="feature-item"><span class="check-icon">✓</span> No Root/Jailbreak</div>
            <div class="feature-item"><span class="check-icon">✓</span> 100% Free</div>
        </div>
    </div>

</body>
</html>
